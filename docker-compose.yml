services:
  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./.env
    environment:
      - VALKEY_URL=${VALKEY_URL:-redis://valkey:6379/0}
    ports:
      - "8000:8000"
    depends_on:
      - valkey
    restart: unless-stopped

  nginx:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
